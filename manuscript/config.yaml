# Digi-PPPiP Manuscript Configuration
# Structurally compliant with projects/template_code_project/manuscript/config.yaml.
# Consumed by infrastructure rendering/publishing and by
# src/manuscript_variables.py (experiment parameters + paper metadata).

paper:
  title: "DigiPPPiP: Digital Partner Pen Play in Parallel"
  subtitle: "A Cyberphysical, Temporal, Active-Inference, and Place-Based Successor to PPPiP (2018)"
  version: "1.0"
  date: ""

authors:
  - name: "Daniel Ari Friedman"
    affiliation: "Active Inference Institute"
    corresponding: true
  - name: "Mikhailova"
  - name: "Sidcode"
  - name: "Evelyn"

publication:
  # Leave blank until a real archive or journal DOI is minted.
  doi: ""
  journal: ""
  volume: ""
  pages: ""
  year: "2026"

keywords:
  - "partner pen play in parallel"
  - "active inference"
  - "inter-brain synchrony"
  - "geometric hyperscanning"
  - "narrative information theory"
  - "neuroergonomics"
  - "digital placemaking"
  - "relational technology"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

llm:
  reviews:
    enabled: false
  translations:
    enabled: false

# ZERO-MOCK TOLERANCE: any failure blocks manuscript rendering.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Simulation parameters — read by src/metrics.py and src/manuscript_variables.py.
# All simulations are deterministic conceptual models, NOT empirical data.
experiment:
  random_seed: 0
  session_steps: 120              # steps in a modeled DigiPPPiP session
  dyadic_steps: 60                # steps in the coupled active-inference sim
  prior_precision: 1.0
  likelihood_precision: 2.0
  ibs_phases: ["initiation", "elaboration", "convergence", "completion"]
  network_nodes: 8                # nodes in the modeled inter-brain network
  curvature_transition_threshold: 0.15
  narrative_alphabet_size: 6      # distinct stroke classes
  epistemic_curiosity: 1.0
  epistemic_precision: 0.6
  flow_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  technoference_lambda: 0.35
  temporal_modes: ["synchronous", "semisynchronous", "asynchronous"]
  spatial_configs: ["co_located_physical", "remote_digital", "cyberphysical_hybrid"]
